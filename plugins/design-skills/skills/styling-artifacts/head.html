<!-- Font link and theme boot. Goes at the top of every page, before the
     stylesheet. The boot script runs before any content paints: it stamps a
     saved choice onto <html> and otherwise leaves the document un-stamped so
     the claude.ai host or the operating system decides. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&display=swap">
<script>
  (function () {
    let saved = null;
    try { saved = localStorage.getItem("dsa-theme"); } catch (e) {}
    if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  })();
</script>
